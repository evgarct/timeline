name: Form
options:
  bundleIdPrefix: com.evgarct
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: 2.45.4
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  Form:
    type: application
    supportedDestinations: [iOS]
    platform: iOS
    configFiles:
      Debug: Config/Form.defaults.xcconfig
      Release: Config/Form.defaults.xcconfig
    sources:
      - path: Form
        excludes:
          - Resources/AppIconSource.svg
    entitlements:
      path: Form/Resources/Form.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Form/Resources/GeneratedInfo.plist
      properties:
        FormAuthBaseURL: "$(FORM_AUTH_BASE_URL)"
        FormAPIBaseURL: "$(FORM_API_BASE_URL)"
        NSHealthShareUsageDescription: Form reads your steps and walking distance to show activity alongside your body timeline.
        NSCameraUsageDescription: Form uses the camera to scan product barcodes.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evgarct.form
        PRODUCT_NAME: Form
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Form
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - FormTests
        - FormUITests
  FormTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    platform: iOS
    sources:
      - path: FormTests
    dependencies:
      - target: Form
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evgarct.form.tests
        GENERATE_INFOPLIST_FILE: true
  FormUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    platform: iOS
    sources:
      - path: FormUITests
    dependencies:
      - target: Form
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evgarct.form.uitests
        GENERATE_INFOPLIST_FILE: true
